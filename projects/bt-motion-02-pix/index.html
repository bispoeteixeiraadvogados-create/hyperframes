    <script>
      (function () {
        /* SHUTTER_SNIPPET_START */
        if (!window._hfMbUid) window._hfMbUid = 0;
        if (!window._hfMbAttached) window._hfMbAttached = new WeakSet();
        if (!window._hfMbSkipped) window._hfMbSkipped = new WeakSet();
        if (!window._hfMbProxies) window._hfMbProxies = new WeakSet();
        if (!window._hfMbTimeline) window._hfMbTimeline = new WeakMap();
        if (!window._hfMbWarned) window._hfMbWarned = new WeakSet();

        // The declarative form. A copy of a target must not carry it, or the copy is swept
        // as a target of its own; the group's own marker is `data-hf-motion-blur-group`.
        var SWEEP_ATTR = "data-hf-motion-blur";
        // About eight seconds. Long enough for an asynchronously mounted sub-composition, short
        // enough that a page with a genuine mistake in it reports before anyone stops watching.
        var POLL_MS = 32;
        var POLL_TICKS = 250;
        var SWEEP_SELECTOR = "[" + SWEEP_ATTR + "]";
        var OPTION_KEYS = ["shutterAngle", "shutterPhase", "samplesPerFrame", "fps"];

        // A copy is a deep clone, so the attribute rides along on the root AND on every marked
        // descendant. Any one left behind is swept as a target of its own, which clones again.
        var COPY_STRIP = [SWEEP_ATTR, "data-composition-id", "data-fps"];

        function stripAttrs(el) {
          for (var a = 0; a < COPY_STRIP.length; a++) el.removeAttribute(COPY_STRIP[a]);
        }

        function stripCopyAttrs(root) {
          stripAttrs(root);
          var inner = root.querySelectorAll("[" + COPY_STRIP.join("],[") + "]");
          for (var i = 0; i < inner.length; i++) stripAttrs(inner[i]);
        }

        // Shutter length is measured in frames, so the snippet must know the composition
        // frame rate: explicit option, else the target's OWN root, else the first root in
        // the document, else 30. The target's root is what makes two compositions on one
        // page read their own data-fps instead of sharing the first one written.
        function resolveFps(optionFps, target) {
          var explicit = Number(optionFps);
          if (explicit > 0) return explicit;

          var scoped = target ? target.closest("[data-composition-id][data-fps]") : null;
          var root = scoped || document.querySelector("[data-composition-id][data-fps]");
          var rootFps = root ? Number(root.getAttribute("data-fps")) : 0;
          if (rootFps > 0) return rootFps;

          return 30;
        }

        function numOption(value, fallback) {
          return value !== undefined ? Number(value) : fallback;
        }

        // A resolved `transform` is either "none", a 2D matrix(a,b,c,d,e,f) or a 3D
        // matrix3d of 16. Splitting the numbers into the linear part and the
        // translation is what lets the deadband below use a pixel tolerance on the
        // one and an angle/ratio tolerance on the other.
        function parseTransform(value) {
          if (!value || value === "none") return { linear: [1, 0, 0, 1], translate: [0, 0, 0] };
          var nums = value
            .slice(value.indexOf("(") + 1, -1)
            .split(",")
            .map(parseFloat);
          if (nums.length === 16) {
            return {
              linear: [
                nums[0],
                nums[1],
                nums[2],
                nums[4],
                nums[5],
                nums[6],
                nums[8],
                nums[9],
                nums[10],
                nums[3],
                nums[7],
                nums[11],
                nums[15],
              ],
              translate: [nums[12], nums[13], nums[14]],
            };
          }
          return {
            linear: [nums[0], nums[1], nums[2], nums[3]],
            translate: [nums[4], nums[5], 0],
          };
        }

        // Deadband: half a pixel of travel, a thousandth of a unit of linear change,
        // about 0.06 degrees or 0.1% of scale. Below it the average is the source.
        // The 2D and 3D forms have different arities, so a change of form counts as
        // movement rather than being compared component by component.
        function differs(a, b) {
          if (a.linear.length !== b.linear.length) return true;
          for (var i = 0; i < a.linear.length; i++) {
            if (Math.abs(a.linear[i] - b.linear[i]) > 0.001) return true;
          }
          for (var j = 0; j < 3; j++) {
            if (Math.abs(a.translate[j] - b.translate[j]) > 0.5) return true;
          }
          return false;
        }

        window.attachMotionBlur = function (selector, tl, opts) {
          opts = opts || {};
          var shutterAngle = numOption(opts.shutterAngle, 720);
          var shutterPhase = numOption(opts.shutterPhase, -360);
          var requestedSamples = numOption(opts.samplesPerFrame, 16);
          var samples = Number.isFinite(requestedSamples)
            ? Math.max(2, Math.min(64, Math.round(requestedSamples)))
            : 16;
          var items = Array.isArray(selector) ? selector : [selector];
          var targets = items.reduce(function (acc, s) {
            if (typeof s === "string") {
              document.querySelectorAll(s).forEach(function (el) {
                acc.push(el);
              });
            } else if (s instanceof Element) {
              acc.push(s);
            }
            return acc;
          }, []);

          // `samples` counts sub-intervals of the shutter window, so there is one copy at
          // every interval boundary — both ends of the window included — and each carries
          // 1/samples of the source. That is what the reference export shows: the outermost
          // copy sits exactly one frame away from the frame time, not half a step short.
          var copies = samples + 1;
          var alpha = String(1 / samples);

          // A copy is styled by nothing that selected the original: dropping the id also
          // drops every `#id` rule that gave it size, colour and font. So each copy carries
          // its own resolved style inline. Chrome returns "" for a computed style's cssText,
          // so the declarations are enumerated rather than taken wholesale.
          function resolvedStyles(source, out) {
            var cs = getComputedStyle(source);
            var text = "";
            for (var i = 0; i < cs.length; i++) {
              text += cs[i] + ":" + cs.getPropertyValue(cs[i]) + ";";
            }
            // A copy is a still of one instant. Left live, an inherited transition or
            // keyframe animation would carry it somewhere the timeline never sampled.
            out.push(text + "transition:none;animation:none;");
            for (var c = 0; c < source.children.length; c++) {
              resolvedStyles(source.children[c], out);
            }
            return out;
          }

          function paintResolvedStyles(copy, styles, cursor) {
            copy.style.cssText = styles[cursor.i++];
            for (var c = 0; c < copy.children.length; c++) {
              paintResolvedStyles(copy.children[c], styles, cursor);
            }
          }

          // Perspective applies to a parent's children only, and a copy is a grandchild.
          // Sharing the parent's 3D context would need preserve-3d on the group, which
          // mix-blend-mode flattens, so each copy carries the perspective itself. See the
          // header for what that does to the vanishing point.
          function parentPerspective(el) {
            var value = el.parentNode ? getComputedStyle(el.parentNode).perspective : "none";
            return value && value !== "none" ? "perspective(" + value + ") " : "";
          }

          function attachOne(el) {
            var group = document.createElement("div");
            group.setAttribute("data-hf-motion-blur-group", "hf-mb-" + window._hfMbUid++);
            group.style.cssText =
              "position:absolute;left:0;top:0;width:0;height:0;isolation:isolate;pointer-events:none;display:none;";

            var clones = [];
            for (var k = 0; k < copies; k++) {
              var clone = el.cloneNode(true);
              clone.removeAttribute("id");
              stripCopyAttrs(clone);
              clones.push(clone);
              group.appendChild(clone);
            }
            var s = {
              el: el,
              group: group,
              clones: clones,
              samples: [],
              perspective: "",
              watch: null,
            };

            // Resolved styles and the parent's perspective are px once read, so a
            // container-relative element needs them again when its box changes. Per frame
            // that would walk the whole subtree once per copy; on resize it costs nothing
            // on a fixed-size render and keeps a live preview honest.
            function snapshot() {
              var styles = resolvedStyles(el, []);
              s.perspective = parentPerspective(el);
              for (var c = 0; c < clones.length; c++) {
                paintResolvedStyles(clones[c], styles, { i: 0 });
                clones[c].style.position = "absolute";
                clones[c].style.margin = "0";
                clones[c].style.opacity = alpha;
                clones[c].style.mixBlendMode = "plus-lighter";
              }
            }

            // Snapshot BEFORE the group enters the page, so a throw in the style walk leaves
            // nothing behind: the record the rollback needs does not exist until it returns.
            snapshot();
            el.parentNode.insertBefore(group, el);
            if (typeof ResizeObserver === "function") {
              s.watch = new ResizeObserver(snapshot);
              s.watch.observe(el);
            }
            return s;
          }

          var state = [];
          // Every element this call marked. A throw inside `attachOne` never returns its
          // record, so `state` alone cannot give the marks back.
          var claimed = [];
          try {
            for (var q = 0; q < targets.length; q++) {
              var candidate = targets[q];
              // One group per element, whether a second call names it or one call names it
              // twice: a second set of copies over the first would double the ink. Marked
              // BEFORE the copies go in: inserting them runs custom-element reactions

    <script>
      gsap.registerPlugin(CustomEase);
      // Motion tokens BT
      CustomEase.create("bt-emphasized", "M0,0 C0.05,0.7 0.1,1 1,1");
      CustomEase.create("bt-exit", "M0,0 C0.3,0 0.8,0.15 1,1");
      CustomEase.create("bt-standard", "M0,0 C0.2,0 0,1 1,1");
      CustomEase.create("bt-enter", "M0,0 C0,0 0.2,1 1,1");
      const T = { instant: 0.08, fast: 0.2, base: 0.4, slow: 0.8, cinematic: 1.2 };
      const EMPH = "bt-emphasized";
      const EXIT = "bt-exit";
      const STD = "bt-standard";
      const ENTER = "bt-enter";

      // PRNG semeado: partículas idênticas em qualquer frame e em qualquer worker
      function mulberry32(seed) {
        let a = seed >>> 0;
        return function () {
          a = (a + 0x6d2b79f5) >>> 0;
          let t = a;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function buildDissolve() {
        const canvas = document.getElementById("value-canvas");
        const ctx = canvas.getContext("2d");
        const W = canvas.width;
        const H = canvas.height;

        // Valor fictício, rasterizado uma vez com a tipografia funcional BT
        const off = document.createElement("canvas");
        off.width = W;
        off.height = H;
        const o = off.getContext("2d");
        const fontCur = '400 58px "Montserrat"';
        const fontNum = '300 176px "Montserrat"';
        o.font = fontCur;
        const wCur = o.measureText("R$").width;
        o.font = fontNum;
        const wNum = o.measureText("4.850,00").width;
        const gap = 24;
        const total = wCur + gap + wNum;
        const x0 = Math.round((W - total) / 2);
        const base = 242;
        o.textBaseline = "alphabetic";
        o.font = fontCur;
        o.fillStyle = "rgba(244, 237, 226, 0.72)";
        o.fillText("R$", x0, base);
        o.font = fontNum;
        o.fillStyle = "#FAF8F4";
        o.fillText("4.850,00", x0 + wCur + gap, base);

        const left = x0 - 4;
        const right = x0 + total + 4;
        const span = right - left;
        const data = o.getImageData(0, 0, W, H).data;
        const rnd = mulberry32(48500);

        // A frente de dissolução corre da direita para a esquerda
        const FRONT = 0.42;
        const colRelease = (x) => (1 - (x - left) / span) * FRONT;

        const parts = [];
        const STEP = 2;
        for (let y = 0; y < H; y += STEP) {
          for (let x = Math.max(0, left); x < Math.min(W, right); x += STEP) {
            const i = (y * W + x) * 4;
            const a = data[i + 3];
            if (a < 28) continue;
            parts.push({
              x,
              y,
              a: a / 255,
              r: data[i],
              g: data[i + 1],
              b: data[i + 2],
              rel: colRelease(x) + rnd() * 0.12,
              life: 0.26 + rnd() * 0.22,
              speed: 420 + rnd() * 980,
              vy: (rnd() - 0.5) * 10,
            });
          }
        }

        // Linhas horizontais finas que atravessam o quadro
        const lines = [];
        for (let k = 0; k < 14; k++) {
          lines.push({
            y: 118 + rnd() * 128,
            t0: 0.04 + k * 0.032 + rnd() * 0.03,
            life: 0.3 + rnd() * 0.18,
            alpha: 0.18 + rnd() * 0.22,
            w: rnd() < 0.3 ? 2 : 1,
          });
        }

        // Faixas para o deslocamento horizontal (displacement) durante a dissolução
        const STRIP = 6;
        const strips = [];
        for (let y = 0; y < H; y += STRIP) {
          strips.push({ y, hit: rnd() < 0.34, ph: rnd() * 6.283, amp: 1 + rnd() * 3 });
        }

        function draw(p) {
          ctx.clearRect(0, 0, W, H);
          if (p <= 0) {
            ctx.drawImage(off, 0, 0);
            return;
          }
          const frontX = left + Math.max(0, 1 - p / FRONT) * span;
          const env = Math.sin(Math.PI * Math.min(1, p / 0.7));
          const q = Math.floor(p * 30) / 30;

          // Parte ainda íntegra, com deslocamento horizontal discreto em algumas faixas
          if (frontX > left) {
            for (const s of strips) {
              const dx = s.hit ? Math.sin(s.ph + q * 37) * s.amp * env : 0;
              ctx.drawImage(off, 0, s.y, frontX, STRIP, dx, s.y, frontX, STRIP);
            }
          }

          // Partículas nascidas dos próprios caracteres, puxadas para fora do quadro
          for (const pt of parts) {
            if (pt.x < frontX) continue;
            const age = (p - pt.rel) / pt.life;
            if (age >= 1) continue;
            if (age <= 0) {
              ctx.fillStyle = `rgba(${pt.r},${pt.g},${pt.b},${pt.a})`;
              ctx.fillRect(pt.x, pt.y, STEP, STEP);
              continue;
            }
            const e = age * age;
            const x = pt.x + e * pt.speed;
            const y = pt.y + pt.vy * age;
            // rastro proporcional à velocidade: motion blur de obturador de 2 frames
            const v = (2 * age * pt.speed) / pt.life;
            const len = Math.min(140, STEP + v / 15);
            // a energia do pixel se espalha pelo rastro: fragmento fino, nunca bloco sólido
            const alpha = (pt.a * 0.85 * Math.pow(1 - age, 1.6)) / Math.sqrt(len / STEP);
            ctx.fillStyle = `rgba(${pt.r},${pt.g},${pt.b},${alpha})`;
            ctx.fillRect(x - len, y, len, 1);
          }

          // Linhas horizontais finas
          for (const ln of lines) {
            const age = (p - ln.t0) / ln.life;
            if (age <= 0 || age >= 1) continue;
            const startX = left + Math.max(0, 1 - ln.t0 / FRONT) * span;
            const grow = 1 - Math.pow(1 - age, 3);
            const x1 = startX + grow * (W - startX + 60);
            const x0l = startX + Math.pow(age, 2) * (W - startX);
            ctx.fillStyle = `rgba(250,248,244,${ln.alpha * (1 - age)})`;
            ctx.fillRect(x0l, ln.y, Math.max(0, x1 - x0l), ln.w);
          }
        }

        draw(0);
        return draw;
      }

      function build() {
        const draw = buildDissolve();
        const tl = gsap.timeline({ paused: true });

        // ---------- Atmosfera: começa praticamente no escuro ----------
        tl.fromTo("#bg-dark", { opacity: 0.88 }, { opacity: 0, duration: 1.6, ease: STD }, 0);
        tl.fromTo("#bg-glow", { scale: 1 }, { scale: 1.06, duration: 18.5, ease: "none" }, 0);

          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: T.base, ease: EMPH },

          "#ui-label",
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: T.base, ease: EMPH },

        tl.fromTo("#hair-1", { scaleX: 0 }, { scaleX: 1, duration: T.slow, ease: EMPH }, 3.1);
        tl.fromTo(
          "#row-dest",
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: T.base, ease: EMPH },
          3.2,

        tl.fromTo("#hair-2", { scaleX: 0 }, { scaleX: 1, duration: T.slow, ease: EMPH }, 3.3);
        tl.fromTo(
          "#ui-button",
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: T.base, ease: EMPH },

          "#cursor",
          { x: 860, y: 1660 },

        tl.to("#cursor-dot", { scale: 0.72, duration: T.instant, ease: STD }, CLICK);

          "#cursor-halo",
          { scale: 1, opacity: 1 },
          { scale: 1.7, opacity: 0, duration: 0.42, ease: EMPH },
          CLICK,
        );
        tl.to("#ui-button", { scale: 0.97, duration: T.instant, ease: STD }, CLICK);
        tl.to("#ui-button", { scale: 1, duration: T.instant, ease: STD }, CLICK + T.instant);
        // micro reação do valor
        tl.to("#value-canvas", { y: 3, duration: T.instant, ease: STD }, CLICK + 0.02);
        tl.to("#value-canvas", { y: 0, duration: T.fast, ease: STD }, CLICK + 0.1);
        // PIX enviado: funcional, não comemorativo
        tl.to("#btn-confirm", { opacity: 0, duration: T.fast, ease: EXIT }, CLICK + 0.18);
        tl.to("#btn-fill", { opacity: 0, duration: 0.3, ease: STD }, CLICK + 0.18);
        tl.to("#btn-line", { opacity: 1, duration: 0.3, ease: STD }, CLICK + 0.22);
        tl.fromTo(
          "#btn-sent",
          { opacity: 0, y: 8 },
          { opacity: 1, y: 0, duration: T.base, ease: EMPH },
          CLICK + 0.3,

        tl.fromTo(
          "#btn-check-path",
          { strokeDasharray: 32, strokeDashoffset: 32 },
          { strokeDashoffset: 0, duration: T.base, ease: EMPH },
          CLICK + 0.38,

        tl.to("#cursor-inner", { opacity: 0, duration: 0.3, ease: EXIT }, CLICK + 0.55);

        const dissolve = { p: 0 };

          dissolve,
          { p: 0 },
          {

            duration: 1.0,
            ease: "none",
            onUpdate: () => draw(dissolve.p),
          },
          HERO,
        );
        // leve distorção temporal: o valor se alarga um instante enquanto se desfaz
        tl.to("#value-canvas", { scaleX: 1.03, duration: 0.5, ease: EMPH }, HERO);
        // o restante da interface recua e desfoca
        tl.to(
          ["#ui-label", "#ui-details", "#ui-button"],
          { opacity: 0.0, filter: "blur(14px)", duration: 0.9, ease: EXIT, stagger: 0.06 },
          HERO + 0.15,
        );
        tl.to(
          "#ui-panel",
          { opacity: 0.18, filter: "blur(24px)", duration: 1.0, ease: STD },
          HERO + 0.3,
        );
        tl.to("#ui-panel", { opacity: 0, duration: 0.4, ease: EXIT }, 9.2);

        // ---------- CENA 05, ruptura (ritmo desacelera) ----------
        const Q = 9.3;
        tl.fromTo(
          "#s5-l1",
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.55, ease: EMPH },
          Q,
        );
        tl.fromTo(
          "#s5-l2",
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.55, ease: EMPH },
          Q + 0.22,
        );
        tl.fromTo(
          "#s5-rule",
          { scaleX: 0 },
          { scaleX: 1, duration: T.cinematic, ease: EMPH },
          Q + 0.75,
        );
        tl.to("#s5-block", { opacity: 0, y: -10, duration: 0.3, ease: EXIT }, 11.95);

        // ---------- CENA 06, mensagem jurídica ----------
        const M = 12.3;
        tl.fromTo("#s6-rule", { scaleX: 0 }, { scaleX: 1, duration: T.slow, ease: EMPH }, M);
        tl.fromTo(
          "#s6-l1",
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.5, ease: EMPH },
          M + 0.1,
        );
        tl.fromTo(
          "#s6-l2",
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.5, ease: EMPH },
          M + 0.28,
        );
        tl.fromTo(
          "#s6-l3",
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.5, ease: EMPH },
          M + 0.62,
        );
        // a mensagem reduz a presença para a assinatura
        tl.to(
          "#s6-block",
          { opacity: 0, y: -16, filter: "blur(6px)", duration: 0.5, ease: EXIT },
          16.2,
        );

        // ---------- ENCERRAMENTO ----------
        tl.fromTo(
          "#sign-logo",
          { opacity: 0, scale: 0.97 },
          { opacity: 1, scale: 1, duration: 0.6, ease: EMPH },
          16.6,
        );
        tl.fromTo("#fade-out", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: STD }, 18.1);

        window.__timelines["main"] = tl;
        tl.seek(0);
      }

      Promise.all([
        document.fonts.load('300 176px "Montserrat"'),
        document.fonts.load('400 58px "Montserrat"'),
        document.fonts.load('500 30px "Montserrat"'),
        document.fonts.load('600 33px "Montserrat"'),
        document.fonts.load('400 84px "Bodoni Moda"'),
        document.fonts.load('700 88px "Bodoni Moda"'),
      ]).then(build);
    </script>
  </body>
</html>
