          <div data-hf-id="hf-j4c0" id="dw-s2">
            <div data-hf-id="hf-9fiw" id="dw-s2-band"></div>

        <div data-hf-id="hf-odsx" id="dw-fx">
          <div data-hf-id="hf-gruh" id="fx-red"></div>
          <div data-hf-id="hf-kk6j" id="fx-white"></div>
          <div data-hf-id="hf-0ap1" id="fx-grain"></div>

      </div>

      <script>
        (function () {
          // ----------------------------------------------------------------- relogio
          // Espelha scripts/timeline.json (tempo absoluto = tempo local, a cena comeca em 0).
          const T = {
            b: [0.56, 1.68, 2.69, 3.43, 4.41],
            vals: [10000, 11200, 13480, 17640, 22390],
            pct: [0, 12.0, 34.8, 76.4, 123.9],
            roll: [0, 0.2, 0.2, 0.2, 0.11],
            cresce: 1.0,
            fa1: 0.3,
            fb1: 1.45,
            fc1: 2.09,
            fc3: 3.33,
            labels: [4.72, 5.0, 5.28, 5.56, 5.84, 6.12, 6.4],
            doc: [5.1, 6.5],
            fly: [6.82, 7.2],
            wall: [6.96, 10.68],
            s2: [7.23, 7.97, 8.4, 9.44, 10.2],
            freeze: 10.68,
            burst: [11.02, 11.2],
            end: 11.2,
          };
          const RED = "#e5333f";
          const $ = (id) => document.getElementById(id);
          const hash = window.BTGrove.hash;
          const smooth = window.BTGrove.smooth;
          const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
          const easeOutCubic = (u) => 1 - Math.pow(1 - clamp(u, 0, 1), 3);
          const easeInOut = (u) => {
            u = clamp(u, 0, 1);
            return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
          };
          function prng(seed) {
            let a = seed >>> 0;
            return function () {
              a = (a + 0x6d2b79f5) >>> 0;
              let t = Math.imul(a ^ (a >>> 15), 1 | a);
              t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
          }
          const fmt = (v) => Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
          const fmtPct = (v) => v.toFixed(1).replace(".", ",") + "%";

          // ----------------------------------------------------------------- camera no bananal
          // Travelling 3D pelo corredor entre duas fileiras de bananeira (3,5 m). O avanco usa a
          // mesma curva da versao anterior: rush inicial, empurrao a cada golpe e aceleracao na pressao.
          // Duas camadas do mesmo plantio: #dw-field (nitida) e #dw-near (rente a lente, desfocada).
          const ROWS = [-12.25, -8.75, -5.25, -1.75, 1.75, 5.25, 8.75, 12.25];
          const PUSH = [
            // folhas atravessando o corredor na altura da lente: a camera abre caminho por elas
            { base: [-1.7, 1.45, 2.0], L: 2.1, az: 1.45, th0: 0.25, droop: 0.7, W: 0.3, age: 0.7, tear: 0.5 },
            { base: [1.75, 1.6, 0.2], L: 2.2, az: -1.5, th0: 0.2, droop: 0.8, W: 0.32, age: 0.5, tear: 0.35 },
            { base: [-1.8, 1.25, -1.6], L: 2.0, az: 1.7, th0: 0.35, droop: 0.9, W: 0.28, age: 0.9, tear: 0.7 },
            { base: [1.7, 1.75, -3.2], L: 2.3, az: -1.35, th0: 0.15, droop: 0.75, W: 0.3, age: 0.6, tear: 0.55 },
            { base: [-1.75, 1.9, -4.4], L: 2.1, az: 1.55, th0: 0.1, droop: 0.6, W: 0.29, age: 0.8, tear: 0.6 },
          ];
          const GROVE = { seed: 7, rows: ROWS, zFrom: 9, zTo: -120, sprinklers: true, extra: PUSH };
          const canvas = $("dw-field");
          const nearCanvas = $("dw-near");
          const grove = window.BTGrove.create(canvas, GROVE);
          const groveNear = window.BTGrove.create(nearCanvas, GROVE);
          function fieldPos(t) {
            let p = 70 * 0.16 * (1 - Math.exp(-t / 0.16)) + 1.15 * t;
            const burst = [0, 4.5, 6.5, 8.5, 14];
            for (let k = 1; k < 5; k++) {
              const b = T.b[k];
              if (t > b) p += burst[k] * 0.28 * (1 - Math.exp(-(t - b) / 0.28));
            }
            if (t > T.b[4]) {
              const u = t - T.b[4];
              p += (0.98 * u * u) / 2;
            }
            return p;
          }
          // altura da camera: nasce rente as folhas e sobe ate o olho, depois sobe aos poucos na pressao
          const camHeight = (t) => 0.95 + 0.7 * easeInOut((t - 0.04) / 0.5) + 0.25 * smooth(0.6, T.b[4], t) + 0.3 * smooth(T.b[4], T.wall[1], t);
          // inclinacao: olha para cima no rush e assenta; cada golpe sacode o horizonte
          function camPitch(t) {
            let p = 0.16 - 0.1 * easeOutCubic((t - 0.1) / 0.48);
            for (let k = 1; k < 5; k++) {
              const d = t - T.b[k];
              if (d > 0) p += 0.0035 * (10 + 6 * k) * Math.exp(-d / 0.12) * Math.sin(d * 28);
            }
            return p - 0.03 * smooth(T.b[4], T.fly[0], t);
          }
          const camSway = (t) => 0.16 * Math.sin(t * 0.9) - 0.3 + 0.3 * smooth(0, 0.7, t);
          function groveState(t) {
            const press = smooth(T.b[4], T.fly[0], t);
            let pulse = 0;
            T.b.forEach((b, k) => {
              if (t > b) pulse += 0.35 * Math.exp(-(t - b) / 0.35) * (k / 4 + 0.4);
            });
            const z = 4 - 0.8 * fieldPos(t);
            const y = camHeight(t);
            const x = camSway(t);
            const pitch = camPitch(t);
            return {
              eye: [x, y, z],
              target: [x * 0.6, y + pitch * 10, z - 10],
              fov: 52 + 8 * smooth(T.wall[0], T.freeze, t),
              time: t,
              exposure: 1.25 + 0.55 * pulse,
              red: 0.42 * press + 0.12 * smooth(T.wall[0], T.freeze, t),
              fogAlpha: true,
              sun: [0.22, 0.1, -1],
              split: 2.4,
            };
          }
          function drawField(t) {
            const s = groveState(t);
            grove.render(Object.assign({ mode: 1 }, s));
            groveNear.render(Object.assign({ mode: 2 }, s, { exposure: s.exposure * 1.7 }));
            // foco: abre desfocado no rush e assenta; a camada distante fica um pouco mais baixa na parede
            const blur = 0.6 + 6.5 * (1 - smooth(0.22, 0.52, t));
            canvas.style.filter = `blur(${blur.toFixed(2)}px)`;
            canvas.style.opacity = (1 - 0.45 * smooth(T.fly[0], T.fly[1], t)).toFixed(3);
            nearCanvas.style.filter = `blur(${(13 + 8 * (1 - smooth(0.2, 0.6, t))).toFixed(2)}px)`;
          }

          // ----------------------------------------------------------------- microdados
          const COLX = [36, 214, 392, 520, 690, 856];
          const colsEl = $("dw-cols");
          const colSpans = [];
          const rnd = prng(20261004);
          COLX.forEach((x, c) => {
            const col = document.createElement("div");
            col.className = "dw-col";
            col.id = "dw-col" + c;
            col.style.left = x + "px";
            for (let k = 0; k < 40; k++) {
              const sp = document.createElement("span");
              const kind = rnd();
              sp.dataset.base = String(1000 + rnd() * 30000);
              sp.dataset.kind = kind < 0.25 ? "pct" : kind < 0.4 ? "rate" : "money";
              if (kind < 0.25) sp.className = "up";
              col.appendChild(sp);
              colSpans.push(sp);
            }
            colsEl.appendChild(col);
          });
          function microText(sp, f, k) {
            const base = parseFloat(sp.dataset.base);
            const tick = Math.floor(f / (2 + (k % 3)));
            const jitter = hash(k * 977 + tick * 131);
            if (sp.dataset.kind === "pct") return "+" + (0.2 + jitter * 3.8).toFixed(2).replace(".", ",") + "%";
            if (sp.dataset.kind === "rate") return (1 + jitter * 0.09).toFixed(4).replace(".", ",");
            const v = base * (1 + 0.006 * tick * (0.3 + hash(k)) + jitter * 0.004);
            return fmt(v) + "," + String(Math.floor(jitter * 100)).padStart(2, "0");
          }
          let lastMicroFrame = -1;
          function updateMicro(t) {
            const f = Math.floor(t * 30);
            if (f === lastMicroFrame) return;
            lastMicroFrame = f;
            const hot = t > T.b[3];
            for (let k = 0; k < colSpans.length; k++) {
              const sp = colSpans[k];
              sp.textContent = microText(sp, t < 2.5 ? 0 : f, k);
              if (sp.dataset.kind === "pct") sp.className = hot && hash(k + f) > 0.6 ? "hot" : "up";
            }
          }

          // ----------------------------------------------------------------- linhas de alta
          function walk(seed, x0, y0, x1, y1, n, jag) {
            const r = prng(seed);
            let d = `M${x0} ${y0}`;
            let len = 0;
            let px = x0;
            let py = y0;
            for (let i = 1; i <= n; i++) {
              const u = i / n;
              const x = x0 + (x1 - x0) * u + (r() - 0.5) * 30;
              const y = y0 + (y1 - y0) * Math.pow(u, 1.35) + (r() - 0.35) * jag;
              d += ` L${x.toFixed(1)} ${y.toFixed(1)}`;
              len += Math.hypot(x - px, y - py);
              px = x;
              py = y;
            }
            return [d, Math.ceil(len) + 2];
          }
          const lines = [
            [$("dw-line1"), walk(7, -40, 1760, 1130, 330, 26, 120)],
            [$("dw-line2"), walk(8, -40, 1640, 1130, 520, 22, 90)],
            [$("dw-line3"), walk(9, -40, 1860, 1130, 700, 30, 70)],
          ];
          lines.forEach(([el, [d, L]]) => {
            el.setAttribute("d", d);
            el.style.strokeDasharray = `${L}`;
            el.style.strokeDashoffset = `${L}`;
          });

          // ----------------------------------------------------------------- parede
          // projecao plausivel: de R$ 22.390 ate ~R$ 48 mil (nunca milhoes)
          const wallVals = [22390];
          const wr = prng(4413);
          for (let i = 1; i < 60; i++) wallVals.push(wallVals[i - 1] * (1.006 + wr() * 0.016));
          function buildPlane(id, rows, perRow, classes, seed) {
            const el = $(id);
            const r = prng(seed);
            for (let i = 0; i < rows; i++) {
              const row = document.createElement("div");
              row.className = "wall-row " + classes[i % classes.length];
              const parts = [];
              for (let c = 0; c < perRow; c++) {
                const v = wallVals[Math.floor(r() * wallVals.length)];
                parts.push((c % 2 === 0 ? "R$ " : "") + fmt(v));
              }
              row.textContent = parts.join("   ");
              el.appendChild(row);
            }
            return el;
          }
          buildPlane("wall-far", 30, 6, ["dim", "dim", "dim", "red"], 11);
          buildPlane("wall-mid", 13, 3, ["solid", "line", "red", "solid", "line", "solid"], 12);
          buildPlane("wall-mid2", 10, 2, ["line", "solid", "line", "red"], 13);
          $("wall-far").style.top = "-120px";
          $("wall-mid").style.top = "-150px";
          $("wall-mid2").style.top = "-120px";
          const midRows = Array.from(document.querySelectorAll("#wall-mid .wall-row, #wall-mid2 .wall-row"));

          // ----------------------------------------------------------------- tremor, grao, contador
          const shakeEl = $("dw-shake");
          const grainEl = $("fx-grain");
          const digitsEl = $("dw-digits");
          const deltaEl = $("dw-delta-val");
          function shake(t) {
            let amp = 0;
            const imp = [0, 7, 10, 15, 26];
            for (let k = 1; k < 5; k++) {
              const d = t - T.b[k];
              if (d >= 0) amp += imp[k] * Math.exp(-d / 0.16);
            }
            T.s2.forEach((s, k) => {
              const d = t - s;
              if (d >= 0) amp += (6 + (k === 4 ? 10 : 0)) * Math.exp(-d / 0.12);
            });
            amp += 2.5 * smooth(T.b[4], T.fly[0], t) + 7 * smooth(T.wall[0], T.freeze, t);
            const f = Math.floor(t * 30);
            return [(hash(f * 3 + 1) - 0.5) * 2 * amp, (hash(f * 3 + 2) - 0.5) * 2 * amp];
          }
          function frame(rawT) {
            const t = Math.min(rawT, T.freeze);
            drawField(t);
            updateMicro(t);
            const [sx, sy] = shake(t);
            shakeEl.style.transform = `translate3d(${sx.toFixed(2)}px, ${sy.toFixed(2)}px, 0)`;
            const f = Math.floor(t * 30);
            grainEl.style.backgroundPosition = `${Math.floor(hash(f * 7 + 3) * 512)}px ${Math.floor(hash(f * 7 + 4) * 512)}px`;
            let v = T.vals[0];
            let pct = 0;
            for (let k = 1; k < 5; k++) {
              const b = T.b[k];
              const r0 = b - T.roll[k];
              if (t >= b) {
                v = T.vals[k];
                pct = T.pct[k];
              } else if (t > r0) {
                const u = Math.pow((t - r0) / T.roll[k], 2);
                v = T.vals[k - 1] + (T.vals[k] - T.vals[k - 1]) * u;
                pct = T.pct[k - 1] + (T.pct[k] - T.pct[k - 1]) * u;
              }
            }
            digitsEl.textContent = fmt(v);
            deltaEl.textContent = fmtPct(pct);
            if (t > T.wall[0]) {
              const u = (t - T.wall[0]) / (T.freeze - T.wall[0]);
              const step = Math.floor((t - T.wall[0]) * (5 + 9 * u));
              midRows.forEach((r, k) => {
                r.style.color = hash(k * 13 + step * 7) > 0.78 - 0.18 * u ? RED : "";
              });
            }
          }

          // ----------------------------------------------------------------- timeline
          const tl = gsap.timeline({ paused: true });
          const P = { t: 0 };
          tl.to(P, { t: T.end, duration: T.end, ease: "none", onUpdate: () => frame(P.t) }, 0);

          // camera: snap zoom do foco, empurroes por golpe, recuo no 17.640, inclinacao na pressao
          tl.fromTo("#dw-cam", { scale: 1.08, rotation: 0 }, { scale: 1, duration: 0.5, ease: "power2.out" }, 0);
          tl.to("#dw-cam", { scale: 1.05, duration: 0.065, ease: "power2.out" }, 0.5);
          tl.to("#dw-cam", { scale: 1.0, duration: 0.3, ease: "power2.out" }, 0.57);
          tl.to("#dw-cam", { scale: 1.035, duration: T.b[1] - 0.872, ease: "sine.inOut" }, 0.87);
          tl.to("#dw-cam", { scale: 1.075, duration: 0.18, ease: "power3.out" }, T.b[1]);
          tl.to("#dw-cam", { scale: 1.09, duration: T.b[2] - T.b[1] - 0.182, ease: "sine.inOut" }, T.b[1] + 0.18);
          tl.to("#dw-cam", { scale: 1.13, duration: 0.18, ease: "power3.out" }, T.b[2]);
          tl.to("#dw-cam", { scale: 1.15, duration: T.b[3] - T.b[2] - 0.182, ease: "sine.inOut" }, T.b[2] + 0.18);
          tl.to("#dw-cam", { scale: 0.99, rotation: -1.2, duration: 0.32, ease: "power3.out" }, T.b[3]);
          tl.to("#dw-cam", { scale: 1.01, rotation: -0.6, duration: 4.22 - T.b[3] - 0.322, ease: "sine.inOut" }, T.b[3] + 0.32);
          tl.to("#dw-cam", { scale: 0.995, duration: T.b[4] - 4.222, ease: "sine.inOut" }, 4.22);
          tl.to("#dw-cam", { scale: 1.12, rotation: 2.4, duration: 0.2, ease: "power4.out" }, T.b[4]);
          tl.to("#dw-cam", { scale: 1.2, rotation: -1.6, duration: T.fly[0] - T.b[4] - 0.2, ease: "sine.inOut" }, T.b[4] + 0.2);
          tl.to("#dw-cam", { scale: 1.32, rotation: 0, duration: T.fly[1] - T.fly[0], ease: "power3.in" }, T.fly[0]);
          tl.to("#dw-cam", { scale: 1.42, rotation: 1.2, duration: T.freeze - T.fly[1], ease: "power1.in" }, T.fly[1]);

          // ceu: o alerta vermelho entra como acento no 17.640 e domina no 22.390
          tl.to("#dw-sky-red", { opacity: 0.22, duration: 0.3, ease: "power2.out" }, T.b[3]);
          tl.to("#dw-sky-red", { opacity: 0.85, duration: 0.2, ease: "power2.out" }, T.b[4]);

          // curvas de nivel: o terreno vira dado
          tl.fromTo("#dw-contours", { opacity: 0, scale: 0.9, rotation: -6 }, { opacity: 0.14, scale: 1.05, rotation: 0, duration: 1.4, ease: "sine.inOut" }, 2.0);
          tl.to("#dw-contours", { opacity: 0.26, scale: 1.25, rotation: 8, duration: T.fly[0] - 3.4, ease: "sine.in" }, 3.4);
          tl.to("#dw-contours", { opacity: 0, scale: 2.2, duration: 0.35, ease: "power2.in" }, T.fly[0]);

          // ------------------------------- heroi
          // R$ 10.000 aparece no foco, com click: pequeno, estavel, controlado
          const S = [0.44, 0.5, 0.6, 0.84, 0.9];
          tl.fromTo("#dw-num", { opacity: 0, scale: 0.4, filter: "blur(14px)" }, { opacity: 1, scale: S[0], filter: "blur(0px)", duration: 0.2, ease: "power3.out" }, T.b[0]);
          tl.fromTo("#dw-label", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, T.b[0] + 0.04);
          tl.to("#dw-num", { scale: 0.455, duration: T.b[1] - T.b[0] - 0.42, ease: "sine.inOut" }, T.b[0] + 0.2);

          // "cresce": a moldura da capacidade de pagamento se desenha e o indicador aparece
          tl.fromTo("#dw-frame .e-top, #dw-frame .e-bottom", { scaleX: 0 }, { scaleX: 1, duration: 0.32, ease: "power3.out" }, T.cresce - 0.08);
          tl.fromTo("#dw-frame .e-left, #dw-frame .e-right", { scaleY: 0 }, { scaleY: 1, duration: 0.32, ease: "power3.out" }, T.cresce - 0.02);
          tl.fromTo("#dw-frame .corner", { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out", stagger: 0.03 }, T.cresce + 0.08);
          tl.fromTo("#dw-frame, #dw-frame-glow", { scale: 1 }, { scale: 1.04, duration: T.b[3] - T.cresce, ease: "sine.inOut" }, T.cresce);
          tl.fromTo("#dw-delta", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out" }, T.cresce);

          const drift = [0.455, 0.515, 0.62, 0.87];
          for (let k = 1; k < 5; k++) {
            const b = T.b[k];
            const r0 = b - T.roll[k];
            // antecipacao: aperta enquanto os digitos rolam
            tl.to("#dw-num", { scale: drift[k - 1] * 0.95, duration: T.roll[k], ease: "power2.in" }, r0);
            // golpe: salta acima do tamanho final e assenta (recuo do impacto)
            const over = k === 4 ? 2.1 : 1.12;
            tl.fromTo("#dw-num", { scale: S[k] * over, filter: k === 4 ? "blur(12px)" : "blur(7px)" }, { scale: S[k], filter: "blur(0px)", duration: k === 4 ? 0.42 : 0.32, ease: "power3.out", immediateRender: false }, b);
            // eco contornado e onda de choque
            tl.fromTo("#dw-echo" + k, { opacity: 0.75, scale: S[k] }, { opacity: 0, scale: S[k] * 1.5, duration: 0.42, ease: "power2.out", immediateRender: false }, b);
            tl.fromTo("#dw-ring" + k, { opacity: 0.7, scale: 0.3 }, { opacity: 0, scale: 2.4 + 0.5 * k, duration: 0.5, ease: "power2.out", immediateRender: false }, b);
          }
          // deriva continua entre golpes (nunca parado)
          tl.to("#dw-num", { scale: drift[1], duration: T.b[2] - T.b[1] - 0.52, ease: "sine.inOut" }, T.b[1] + 0.32);
          tl.to("#dw-num", { scale: drift[2], duration: T.b[3] - T.b[2] - 0.52, ease: "sine.inOut" }, T.b[2] + 0.32);
          tl.to("#dw-num", { scale: drift[3], duration: 4.21 - T.b[3] - 0.32, ease: "sine.inOut" }, T.b[3] + 0.32);
          tl.to("#dw-num", { scale: 1.16, y: -12, duration: T.fly[0] - T.b[4] - 0.42, ease: "sine.inOut" }, T.b[4] + 0.42);

          // 13.480: encosta na capacidade (brilho dourado na moldura)
          tl.fromTo("#dw-frame-glow", { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none", immediateRender: false }, T.b[2]);
          tl.to("#dw-frame-glow", { opacity: 0, duration: 0.45, ease: "power2.out" }, T.b[2] + 0.06);

          // 17.640: rompe a moldura (primeiro vermelho, como acento)
          tl.set("#dw-frame .edge", { backgroundColor: RED }, T.b[3]);
          tl.set("#dw-cur", { color: RED }, T.b[3]);
          tl.set("#dw-delta", { color: RED }, T.b[3]);
          tl.to("#dw-frame .e-top", { y: -170, rotation: -7, opacity: 0, duration: 0.55, ease: "power2.out" }, T.b[3]);
          tl.to("#dw-frame .e-bottom", { y: 170, rotation: 6, opacity: 0, duration: 0.55, ease: "power2.out" }, T.b[3]);
          tl.to("#dw-frame .e-left", { x: -230, rotation: -14, opacity: 0, duration: 0.55, ease: "power2.out" }, T.b[3]);
          tl.to("#dw-frame .e-right", { x: 230, rotation: 12, opacity: 0, duration: 0.55, ease: "power2.out" }, T.b[3]);
          tl.to("#dw-frame .c-tl", { x: -180, y: -160, opacity: 0, duration: 0.5, ease: "power2.out" }, T.b[3]);
          tl.to("#dw-frame .c-tr", { x: 180, y: -160, opacity: 0, duration: 0.5, ease: "power2.out" }, T.b[3]);
          tl.to("#dw-frame .c-bl", { x: -180, y: 160, opacity: 0, duration: 0.5, ease: "power2.out" }, T.b[3]);
          tl.to("#dw-frame .c-br", { x: 180, y: 160, opacity: 0, duration: 0.5, ease: "power2.out" }, T.b[3]);
          tl.to("#dw-label", { opacity: 0, y: -24, duration: 0.14, ease: "power2.in" }, T.b[3]);
          tl.to("#dw-delta", { y: 84, duration: 0.3, ease: "power3.out" }, T.b[3]);

          // 22.390: quase colide com a camera
          tl.fromTo("#dw-num-glow", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1.25, duration: 0.3, ease: "power2.out" }, T.b[4]);
          tl.to("#dw-num-glow", { opacity: 0.55, scale: 1.45, duration: T.fly[0] - T.b[4] - 0.3, ease: "sine.inOut" }, T.b[4] + 0.3);
          tl.to("#dw-delta", { x: -70, y: 310, scale: 1.55, duration: 0.3, ease: "power3.out" }, T.b[4]);

          // mergulho atraves do numero
          tl.to("#dw-num", { scale: 8, filter: "blur(30px)", duration: 0.32, ease: "power3.in" }, T.fly[0]);
          tl.to("#dw-num", { opacity: 0, duration: 0.1, ease: "none" }, T.fly[0] + 0.22);
          tl.to("#dw-num-glow", { opacity: 0, scale: 3, duration: 0.3, ease: "power2.in" }, T.fly[0]);
          tl.to("#dw-delta", { scale: 4, opacity: 0, duration: 0.28, ease: "power2.in" }, T.fly[0]);

          // ------------------------------- texto cinetico (frase 1)
          const fragIn = (sel, at, from) =>
            tl.fromTo(sel, Object.assign({ opacity: 0, y: 46, filter: "blur(8px)" }, from || {}), { opacity: 1, y: 0, x: 0, skewX: 0, scaleY: 1, filter: "blur(0px)", duration: 0.26, ease: "power4.out" }, at);
          const fragOut = (sel, at) => tl.to(sel, { opacity: 0, y: -60, filter: "blur(8px)", duration: 0.17, ease: "power3.in" }, at);
          fragIn("#dw-fa1", T.fa1);
          fragIn("#dw-fa2", T.cresce, { y: 60, scaleY: 0.55 });
          fragOut("#dw-fa1, #dw-fa2", T.fb1 - 0.05);
          fragIn("#dw-fb1", T.fb1 + 0.04);
          fragIn("#dw-fb2", T.b[1], { y: 0, x: 160, skewX: -22, filter: "blur(12px)" });
          fragOut("#dw-fb1, #dw-fb2", T.fc1 - 0.05);
          fragIn("#dw-fc1", T.fc1 + 0.04);
          fragIn("#dw-fc2", T.b[2]);
          fragIn("#dw-fc3", T.fc3);
          tl.set("#dw-fc2, #dw-fc3", { color: RED }, T.b[3]);
          tl.to("#dw-fc1, #dw-fc2, #dw-fc3", { opacity: 0, scale: 1.6, y: -50, filter: "blur(14px)", duration: 0.22, ease: "power2.in" }, T.b[4]);

          // ------------------------------- flashes (curtos; vermelho so a partir do 17.640)
          tl.fromTo("#fx-white", { opacity: 0.45 }, { opacity: 0, duration: 0.14, ease: "power2.out", immediateRender: false }, T.b[2]);
          tl.fromTo("#fx-white", { opacity: 0.3 }, { opacity: 0, duration: 0.12, ease: "power2.out", immediateRender: false }, T.b[3]);
          tl.fromTo("#fx-red", { opacity: 0.3 }, { opacity: 0, duration: 0.16, ease: "power2.out", immediateRender: false }, T.b[3] + 0.03);
          tl.fromTo("#fx-white", { opacity: 0.85 }, { opacity: 0, duration: 0.05, ease: "none", immediateRender: false }, T.b[4]);
          tl.fromTo("#fx-red", { opacity: 0.75 }, { opacity: 0, duration: 0.22, ease: "power2.out", immediateRender: false }, T.b[4] + 0.05);
          tl.fromTo("#fx-redvig", { opacity: 0.0 }, { opacity: 0.51, duration: 0.1, ease: "power2.out", immediateRender: false }, T.b[4]);
          tl.to("#fx-redvig", { opacity: 0.24, duration: 0.5, ease: "power2.out" }, T.b[4] + 0.1);
          T.labels.forEach((lt, k) => {
            if (k % 2 === 0) tl.fromTo("#fx-redvig", { opacity: 0.48 }, { opacity: 0.24, duration: 0.3, ease: "power2.out", immediateRender: false }, lt);
          });

          // ------------------------------- pressao
          tl.fromTo("#dw-cols", { opacity: 0 }, { opacity: 0.12, duration: 0.5, ease: "sine.inOut" }, 2.6);
          tl.to("#dw-cols", { opacity: 0.24, duration: 0.6, ease: "sine.inOut" }, T.b[4]);
          tl.to("#dw-cols", { opacity: 0.32, duration: 1.2, ease: "sine.inOut" }, 5.4);
          COLX.forEach((x, c) => {
            const dir = c % 2 === 0 ? -1 : -0.6;
            tl.fromTo("#dw-col" + c, { y: 0 }, { y: dir * (520 + c * 40), duration: T.fly[0] - 2.6, ease: "power2.in" }, 2.6);
          });
          tl.to("#dw-cols", { scale: 2.2, opacity: 0, duration: 0.32, ease: "power2.in", transformOrigin: "540px 900px" }, T.fly[0]);

          lines.forEach(([el], k) => {
            tl.to(el, { strokeDashoffset: 0, duration: 2.3 - k * 0.25, ease: "power1.in" }, T.b[4] + 0.05 + k * 0.18);
          });
          tl.to("#dw-lines", { opacity: 0, scale: 1.8, duration: 0.3, ease: "power2.in", transformOrigin: "540px 900px" }, T.fly[0]);

          T.labels.forEach((lt, k) => {
            const sel = "#dw-tag" + k;
            tl.fromTo(sel, { opacity: 0, scale: 1.45, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.18, ease: "power3.out" }, lt);
            tl.to(sel, { y: -36 - k * 3, duration: T.fly[0] - lt, ease: "sine.in" }, lt);
            const away = [[-260, -220], [260, 220], [260, -220], [-260, 220], [120, -300], [-80, 300], [-300, -60]][k];
            tl.to(sel, { x: away[0], y: away[1], scale: 2.4, opacity: 0, filter: "blur(10px)", duration: 0.3, ease: "power2.in" }, T.fly[0]);
          });

          // documento: a cedula atravessa o quadro (passa atras do numero e depois na frente)
          tl.fromTo(
            "#dw-doc",
            { opacity: 0, x: 420, y: 160, z: -900, rotationY: -40, rotationX: 16, rotation: 8, transformPerspective: 1200, filter: "blur(3px)" },
            { opacity: 1, x: 120, y: 40, z: -350, rotationY: -22, rotationX: 10, rotation: 4, filter: "blur(0px)", duration: 0.5, ease: "power2.out" },
            T.doc[0],
          );
          tl.to("#dw-doc", { x: -60, y: -20, z: 80, rotationY: 6, rotationX: 6, rotation: -2, duration: 0.55, ease: "sine.inOut" }, T.doc[0] + 0.5);
          tl.set("#dw-doc", { zIndex: 3 }, T.doc[1] - 0.4);
          tl.to("#dw-doc", { x: -380, y: -120, z: 760, rotationY: 30, rotationX: 2, rotation: -9, opacity: 0, filter: "blur(14px)", duration: 0.35, ease: "power2.in" }, T.doc[1] - 0.35);

          // ------------------------------- parede de numeros
          tl.fromTo("#fx-white", { opacity: 0.55 }, { opacity: 0, duration: 0.12, ease: "power2.out", immediateRender: false }, T.wall[0]);
          tl.fromTo("#dw-wall", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.26, ease: "power3.out" }, T.wall[0]);
          tl.to("#dw-wall", { scale: 1.34, duration: T.freeze - T.wall[0] - 0.26, ease: "power2.in" }, T.wall[0] + 0.26);
          tl.fromTo("#wall-far", { y: 0, x: 0 }, { y: -320, x: -120, duration: T.freeze - T.wall[0], ease: "power1.in" }, T.wall[0]);
          tl.fromTo("#wall-mid", { y: 0 }, { y: -560, duration: T.freeze - T.wall[0], ease: "power2.in" }, T.wall[0]);
          tl.fromTo("#wall-mid2", { opacity: 0, y: 260 }, { opacity: 0.55, y: -600, duration: T.freeze - 8.3, ease: "power2.in" }, 8.3);
          Array.from(document.querySelectorAll("#wall-mid .wall-row")).forEach((r, k) => {
            const d = (k % 2 === 0 ? -1 : 1) * (260 + (k % 3) * 120);
            tl.fromTo(r, { x: 0 }, { x: d, duration: T.freeze - T.wall[0], ease: "power2.in" }, T.wall[0]);
          });
          Array.from(document.querySelectorAll("#wall-mid2 .wall-row")).forEach((r, k) => {
            const d = (k % 2 === 0 ? 1 : -1) * (300 + (k % 3) * 140);
            tl.fromTo(r, { x: 0 }, { x: d, duration: T.freeze - 8.3, ease: "power2.in" }, 8.3);
          });
          [[8.05, 1], [8.95, 2], [9.75, 3], [10.3, 1]].forEach(([at, n]) => {
            const sel = "#wall-near" + n;
            tl.fromTo(sel, { opacity: 0, scale: 0.5, filter: "blur(2px)" }, { opacity: 0.85, scale: 1.4, filter: "blur(0px)", duration: 0.22, ease: "power2.out", immediateRender: false }, at);
            tl.to(sel, { opacity: 0, scale: 3.4, filter: "blur(18px)", duration: Math.min(0.36, T.freeze - at - 0.22), ease: "power2.in" }, at + 0.22);
          });
          // pulsos vermelhos acelerando (vinheta; flash cheio nunca acima de 3 por segundo)
          let pt = T.wall[0] + 0.25;
          let pk = 0;
          while (pt < T.freeze - 0.1) {
            const u = (pt - T.wall[0]) / (T.freeze - T.wall[0]);
            tl.fromTo("#fx-redvig", { opacity: 0.57 }, { opacity: (0.35 + 0.3 * u) * 0.6, duration: 0.2, ease: "power2.out", immediateRender: false }, pt);
            if (pk % 3 === 0) tl.fromTo("#fx-red", { opacity: 0.16 + 0.1 * u }, { opacity: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, pt);
            pt += 0.5 - 0.3 * u;
            pk++;
          }

          // ------------------------------- frase 2 sobre a parede
          tl.fromTo("#dw-s2-band", { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power2.out" }, T.s2[0] - 0.08);
          const slam = (sel, at, s0) => {
            tl.fromTo(sel, { opacity: 0, scale: s0 || 1.3, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.16, ease: "power4.out" }, at);
          };
          slam("#dw-s2a", T.s2[0]);
          slam("#dw-s2b", T.s2[1], 1.4);
          tl.fromTo("#dw-s2-under", { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.35, ease: "power3.out" }, T.s2[1] + 0.12);
          slam("#dw-s2c", T.s2[2]);
          slam("#dw-s2d", T.s2[3]);
          slam("#dw-s2e", T.s2[4], 1.55);
          T.s2.slice(1).forEach((at, k) => {
            tl.to("#dw-s2", { y: -(k + 1) * 14, duration: 0.25, ease: "power3.out" }, at);
          });
          tl.fromTo("#fx-white", { opacity: 0.4 }, { opacity: 0, duration: 0.1, ease: "power2.out", immediateRender: false }, T.s2[4]);

          // ------------------------------- CONGELAMENTO e estouro
          tl.set("#dw-cam", { filter: "saturate(0.5) brightness(0.8)" }, T.freeze);
          tl.set("#fx-redvig", { opacity: 0.3 }, T.freeze);
          tl.set("#fx-red, #fx-white", { opacity: 0 }, T.freeze);
          tl.fromTo("#dw-burst", { scale: 1, opacity: 1, filter: "blur(0px)" }, { scale: 2.5, opacity: 0, filter: "blur(22px)", duration: T.burst[1] - T.burst[0], ease: "power3.in" }, T.burst[0]);
          tl.to("#fx-redvig", { opacity: 0.0, duration: 0.16, ease: "power2.in" }, T.burst[0]);
          tl.to("#dw-sky-red", { opacity: 0, duration: 0.16, ease: "power2.in" }, T.burst[0]);

          frame(0);
          window.addEventListener("hf-seek", (e) => {
            if (e && e.detail && typeof e.detail.time === "number" && e.detail.time <= T.end) frame(e.detail.time);
          });
          window.__timelines["debt-world"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
